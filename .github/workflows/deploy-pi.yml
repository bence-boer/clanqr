name: Deploy to Pi

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  sanity-checks:
    runs-on: [self-hosted, pi]
    env:
      APP_DIR: /home/scoy/Developer/repositories/ralph-agent-workspace
      BUN_INSTALL: /home/scoy/.bun
    steps:
      - name: Pull latest code
        run: |
          git config --global --add safe.directory $APP_DIR
          cd $APP_DIR
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bence-boer/ralph-agent-workspace.git main
          git reset --hard FETCH_HEAD

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR
          cd server && bun install --frozen-lockfile
          cd ../web && bun install --frozen-lockfile

      - name: Type-check server
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server
          bun run --bun tsc --noEmit

      - name: Type-check web
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/web
          bun run --bun check

      - name: Run unit tests
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server
          bun test

  deploy:
    needs: sanity-checks
    runs-on: [self-hosted, pi]
    env:
      APP_DIR: /home/scoy/Developer/repositories/ralph-agent-workspace
      BUN_INSTALL: /home/scoy/.bun
    steps:
      - name: Setup environment
        run: |
          cat > /tmp/ralph-api.env << EOF
          SUPABASE_URL=http://172.17.0.1:54321
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          RP_ID=agents.benceboer.com
          RP_ORIGIN=https://agents.benceboer.com
          PORT=3001
          EOF
          sudo cp /tmp/ralph-api.env /etc/ralph-api.env
          sudo chmod 600 /etc/ralph-api.env

      - name: Apply database migrations
        run: |
          set -e
          cd $APP_DIR
          for f in supabase/supabase/migrations/*.sql; do
            version=$(basename "$f" | cut -d_ -f1)
            already=$(docker exec supabase_db_supabase psql -U postgres -d postgres -tAc \
              "SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='$version'" 2>/dev/null)
            if [ "$already" != "1" ]; then
              echo "Applying migration: $(basename $f)"
              if ! docker exec -i supabase_db_supabase psql -U postgres -d postgres --set ON_ERROR_STOP=1 < "$f"; then
                echo "❌ Migration failed: $(basename $f)"
                exit 1
              fi
              docker exec supabase_db_supabase psql -U postgres -d postgres -c \
                "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('$version', '$(basename ${f%.sql} | sed "s/^[0-9]*_//")')"
            fi
          done

      - name: Build web
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/web
          PUBLIC_API_URL= bun --bun run build

      - name: Trigger service restart
        run: |
          touch $APP_DIR/.deploy-trigger
