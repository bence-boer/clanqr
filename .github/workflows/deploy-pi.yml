name: Deploy to Pi

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    steps:
      - name: Pull latest code
        run: |
          git config --global --add safe.directory /home/scoy/Developer/repositories/ralph-agent-workspace
          cd /home/scoy/Developer/repositories/ralph-agent-workspace
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bence-boer/ralph-agent-workspace.git main
          git reset --hard FETCH_HEAD

      - name: Install dependencies
        run: |
          export BUN_INSTALL="/home/scoy/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd /home/scoy/Developer/repositories/ralph-agent-workspace
          cd server && bun install --frozen-lockfile
          cd ../web && bun install --frozen-lockfile

      - name: Apply database migrations
        run: |
          cd /home/scoy/Developer/repositories/ralph-agent-workspace
          for f in supabase/supabase/migrations/*.sql; do
            version=$(basename "$f" | cut -d_ -f1)
            already=$(docker exec supabase_db_supabase psql -U postgres -d postgres -tAc \
              "SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='$version'" 2>/dev/null)
            if [ "$already" != "1" ]; then
              echo "Applying migration: $(basename $f)"
              docker exec -i supabase_db_supabase psql -U postgres -d postgres < "$f"
              docker exec supabase_db_supabase psql -U postgres -d postgres -c \
                "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('$version', '$(basename ${f%.sql} | sed "s/^[0-9]*_//")')"
            fi
          done

      - name: Build web
        run: |
          export BUN_INSTALL="/home/scoy/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd /home/scoy/Developer/repositories/ralph-agent-workspace/web
          PUBLIC_API_URL= bun --bun run build

      - name: Trigger service restart
        run: |
          touch /home/scoy/Developer/repositories/ralph-agent-workspace/.deploy-trigger
