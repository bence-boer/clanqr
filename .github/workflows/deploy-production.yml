name: Deploy Production

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/scoy/Developer/repositories/ralph-agent-workspace
  BUN_INSTALL: /home/scoy/.bun

jobs:
  sanity-checks:
    runs-on: [self-hosted, pi]
    steps:
      - name: Pull latest code
        run: |
          cd $APP_DIR
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          git reset --hard FETCH_HEAD

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server && bun install --frozen-lockfile
          cd $APP_DIR/web && bun install --frozen-lockfile

      - name: Type-check server
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server && bun run --bun tsc --noEmit

      - name: Type-check web
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/web && bun run --bun check

      - name: Run unit tests
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server && bun test

  deploy:
    needs: sanity-checks
    runs-on: [self-hosted, pi]
    environment: production
    env:
      ENV_FILE: /etc/ralph-api.env
    steps:
      - name: Setup environment
        run: |
          cat > /tmp/ralph-api-prod.env << 'ENVEOF'
          SUPABASE_URL=http://172.17.0.1:54321
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL=${{ secrets.GITHUB_CALLBACK_URL }}
          ADMIN_GITHUB_IDS=${{ secrets.ADMIN_GITHUB_IDS }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          NODE_ENV=production
          PORT=3001
          ENVEOF
          sudo cp /tmp/ralph-api-prod.env $ENV_FILE
          sudo chmod 600 $ENV_FILE
          rm -f /tmp/ralph-api-prod.env

      - name: Build agent base image
        run: |
          cd $APP_DIR
          docker build -t ralph-agent-base:latest -f server/Dockerfile.agent server/

      - name: Apply database migrations
        run: |
          set -e
          cd $APP_DIR
          for f in supabase/supabase/migrations/*.sql; do
            version=$(basename "$f" | cut -d_ -f1)
            name=$(basename "${f%.sql}" | sed 's/^[0-9]*_//')
            already=$(docker exec ralph_dev_db psql -U postgres -d postgres -tAc \
              "SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='$version'" 2>/dev/null)
            if [ "$already" != "1" ]; then
              echo "Applying migration: $(basename "$f")"
              if ! {
                echo "BEGIN;"
                sed '/^BEGIN;$/d; /^COMMIT;$/d' "$f"
                echo "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('${version}', '${name}');"
                echo "COMMIT;"
              } | docker exec -i ralph_dev_db psql -U postgres -d postgres --set ON_ERROR_STOP=1; then
                echo "::error::Migration failed: $(basename "$f")"
                exit 1
              fi
              echo "Applied: $(basename "$f")"
            fi
          done

      - name: Ensure database roles and permissions
        run: |
          DB_EXEC="docker exec ralph_dev_db psql -U postgres -d postgres"
          # Create service_role if it doesn't exist (needed for PostgREST JWT)
          $DB_EXEC -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;" 2>/dev/null || true
          $DB_EXEC -c "GRANT ALL ON SCHEMA public TO service_role;"
          $DB_EXEC -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;"
          $DB_EXEC -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO service_role;"
          $DB_EXEC -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO service_role;"
          $DB_EXEC -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO service_role;"
          $DB_EXEC -c "NOTIFY pgrst, 'reload schema';"

      - name: Build web
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/web
          PUBLIC_API_URL= bun --bun run build

      - name: Trigger service restart
        run: touch $APP_DIR/.deploy-trigger

      - name: Verify deployment
        run: |
          echo "Waiting for services to restart..."
          sleep 10
          CURL="docker run --rm --network host curlimages/curl --max-time 5"
          for i in 1 2 3 4 5 6; do
            if $CURL -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✅ API is healthy"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "::error::API health check failed after 30 seconds"
              exit 1
            fi
            sleep 5
          done
          for i in 1 2 3 4 5 6; do
            if $CURL -sf http://localhost:3002 > /dev/null 2>&1; then
              echo "✅ Web is healthy"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "::error::Web health check failed after 30 seconds"
              exit 1
            fi
            sleep 5
          done

      - name: Rollback on failure
        if: failure()
        run: |
          cd $APP_DIR
          echo "::warning::Rolling back to previous commit"
          git reset --hard HEAD~1
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd server && bun install --frozen-lockfile
          cd ../web && bun install --frozen-lockfile
          PUBLIC_API_URL= bun --bun run build
          cd ..
          touch .deploy-trigger
