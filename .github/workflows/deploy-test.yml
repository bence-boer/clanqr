name: Deploy Test

on:
  push:
    branches: ['develop']
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  APP_DIR: /home/scoy/Developer/repositories/ralph-test
  BUN_INSTALL: /home/scoy/.bun

jobs:
  sanity-checks:
    runs-on: [self-hosted, pi]
    steps:
      - name: Pull latest code
        run: |
          git config --global --add safe.directory $APP_DIR
          cd $APP_DIR
          git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git develop
          git reset --hard FETCH_HEAD
          chown -R 1000:1000 .

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server && bun install --frozen-lockfile
          cd $APP_DIR/web && bun install --frozen-lockfile

      - name: Type-check server
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server && bun run --bun tsc --noEmit

      - name: Type-check web
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/web && bun run --bun check

      - name: Run unit tests
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/server && bun test

  deploy:
    needs: sanity-checks
    runs-on: [self-hosted, pi]
    environment: test
    env:
      ENV_FILE: /etc/ralph-api-test.env
    steps:
      - name: Ensure test database is running
        run: |
          git config --global --add safe.directory $APP_DIR
          cd $APP_DIR
          docker compose -f docker-compose.test.yml up -d
          for i in $(seq 1 30); do
            if docker exec ralph_test_db pg_isready -U postgres > /dev/null 2>&1; then
              echo "✅ Test database is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Test database failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Setup environment
        run: |
          cat > /tmp/ralph-api-test.env << ENVEOF
          SUPABASE_URL=http://localhost:54331
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL=${{ secrets.GITHUB_CALLBACK_URL }}
          ADMIN_GITHUB_IDS=${{ secrets.ADMIN_GITHUB_IDS }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          NODE_ENV=test
          PORT=3011
          LOG_LEVEL=debug
          CLI_URL=localhost:4321
          ENVEOF
          # Strip leading whitespace from heredoc indentation
          sed -i 's/^[[:space:]]*//' /tmp/ralph-api-test.env
          sudo cp /tmp/ralph-api-test.env $ENV_FILE
          sudo chmod 600 $ENV_FILE
          rm -f /tmp/ralph-api-test.env

      - name: Verify Copilot CLI is reachable
        run: |
          # The Copilot CLI headless server uses TCP (not HTTP) on port 4321.
          # CI runner uses host networking — localhost reaches host services directly.
          for i in 1 2 3; do
            if nc -z -w 2 localhost 4321 2>/dev/null; then
              echo "✅ Copilot CLI is reachable on port 4321"
              exit 0
            fi
            echo "Attempt $i: Copilot CLI not yet reachable, waiting 2s..."
            sleep 2
          done
          echo "::warning::Copilot CLI is not reachable on port 4321 — agent dispatch will be unavailable"

      - name: Reset and seed test database
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR
          chmod +x scripts/test-db-reset.sh
          ./scripts/test-db-reset.sh

      - name: Build web
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/web
          PUBLIC_API_URL= bun --bun run build

      - name: Trigger service restart
        run: touch $APP_DIR/.deploy-trigger-test

      - name: Verify deployment
        run: |
          echo "Waiting for services to restart..."
          sleep 10
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 http://localhost:3011/health > /dev/null 2>&1; then
              echo "✅ Test API is healthy"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Test API health check failed after 110s"
              exit 1
            fi
            sleep 5
          done
          for i in $(seq 1 20); do
            if curl -sf --max-time 5 http://localhost:3012 > /dev/null 2>&1; then
              echo "✅ Test Web is healthy"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Test Web health check failed after 110s"
              exit 1
            fi
            sleep 5
          done

      - name: Install E2E dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR && bun install --frozen-lockfile
          # Install system libraries required by Playwright Chromium
          cd $APP_DIR/e2e && bun x --bun playwright install-deps chromium

      - name: Run E2E tests (fast suite)
        env:
          CI: "true"
          BASE_URL: http://test.clanqr.dev
          API_URL: http://localhost:3011
          PLAYWRIGHT_BROWSERS_PATH: /home/scoy/.cache/ms-playwright
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/e2e
          bun x --bun playwright test --grep-invert "agent execution"

      - name: Enable TEST_MODE for agent execution
        run: |
          echo "TEST_MODE=true" | sudo tee -a $ENV_FILE > /dev/null
          touch $APP_DIR/.deploy-trigger-test
          echo "Waiting for server to restart with TEST_MODE=true..."
          for i in $(seq 1 60); do
            HEALTH=$(curl -sf --max-time 3 http://localhost:3011/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | grep -q '"test_mode":true'; then
              echo "✅ Test API is healthy with TEST_MODE=true"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Server did not pick up TEST_MODE=true within 60s"
              exit 1
            fi
            sleep 2
          done

      - name: Run E2E tests (agent execution)
        env:
          CI: "true"
          BASE_URL: http://test.clanqr.dev
          API_URL: http://localhost:3011
          PLAYWRIGHT_BROWSERS_PATH: /home/scoy/.cache/ms-playwright
          TEST_MODE: "true"
        timeout-minutes: 25
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR/e2e
          bun x --bun playwright test agent-execution

      - name: Disable TEST_MODE after agent execution
        if: always()
        run: |
          sudo sed -i '/^TEST_MODE=true$/d' $ENV_FILE
          touch $APP_DIR/.deploy-trigger-test
          echo "Waiting for server to restart without TEST_MODE..."
          for i in $(seq 1 60); do
            HEALTH=$(curl -sf --max-time 3 http://localhost:3011/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | grep -q '"test_mode":false'; then
              echo "✅ Test API is healthy after removing TEST_MODE"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::warning::Server did not pick up TEST_MODE=false within 60s"
              break
            fi
            sleep 2
          done

      - name: Rollback on failure
        if: failure()
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          cd $APP_DIR
          git reset --hard HEAD~1
          chown -R 1000:1000 .
          cd server && bun install --frozen-lockfile
          cd ../web && bun install --frozen-lockfile
          PUBLIC_API_URL= bun --bun run build
          cd ..
          touch .deploy-trigger-test
