# Nginx gateway for local dev — mimics Supabase's Kong API gateway
# Routes /rest/v1/* to PostgREST (strips the prefix)

server {
    listen 80;
    server_name localhost;

    # Supabase JS client sends requests to /rest/v1/<table>
    location /rest/v1/ {
        # Strip /rest/v1 prefix and forward to PostgREST
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://rest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct access to PostgREST (for health checks, debugging)
    location / {
        proxy_pass http://rest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
